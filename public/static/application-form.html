<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ариза барои хобгоҳ | SDMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<nav class="navbar navbar-dark app-navbar"><div class="container"><a class="navbar-brand" href="layout.html">SDMS</a></div></nav>
<main class="container py-4">
<h1>Ариза барои ҷой дар хобгоҳ</h1>
<p class="text-secondary">Ҳамаи майдонҳои бо * ишорашуда ҳатмӣ мебошанд.</p>
<form id="dorm-application-form" class="app-card p-3 p-md-4" novalidate>
<div class="row g-3">
<div class="col-md-6"><label class="form-label" for="full-name">Ному насаб *</label><input class="form-control" id="full-name" name="full_name" required maxlength="80" autocomplete="name"><div class="invalid-feedback" id="full-name-error"></div></div>
<div class="col-md-6"><label class="form-label" for="student-code">Рақами донишҷӯӣ *</label><input class="form-control" id="student-code" name="student_code" required maxlength="20" pattern="[A-Za-z0-9-]{4,20}" placeholder="STU-007"><div class="invalid-feedback" id="student-code-error"></div></div>
<div class="col-md-6"><label class="form-label" for="email">Почтаи электронӣ *</label><input class="form-control" id="email" name="email" type="email" required maxlength="120"><div class="invalid-feedback" id="email-error"></div></div>
<div class="col-md-6"><label class="form-label" for="phone">Телефон *</label><input class="form-control" id="phone" name="phone" type="tel" required pattern="[0-9+() -]{7,20}" maxlength="20" placeholder="+992 900 00 00 00"><div class="invalid-feedback" id="phone-error"></div></div>
<div class="col-md-4"><label class="form-label" for="room-number">Ҳуҷраи дилхоҳ *</label><select class="form-select" id="room-number" name="room_number" required><option value="">Интихоб кунед</option><option>101</option><option>201</option><option>202</option><option>301</option></select><div class="invalid-feedback" id="room-number-error"></div></div>
<div class="col-md-4"><label class="form-label" for="move-in">Санаи воридшавӣ *</label><input class="form-control" id="move-in" name="move_in" type="date" required><div class="invalid-feedback" id="move-in-error"></div></div>
<div class="col-md-4"><label class="form-label" for="move-out">Санаи баромадан *</label><input class="form-control" id="move-out" name="move_out" type="date" required><div class="invalid-feedback" id="move-out-error"></div></div>
</div>
<p id="application-form-result" class="mt-3" aria-live="polite"></p>
<button class="btn btn-primary" type="submit">Санҷидани маълумот</button>
<a href="applications.html" class="btn btn-outline-secondary">Бозгашт</a>
</form></main>
<script type="module" src="../assets/js/app.js"></script>
</body></html>
